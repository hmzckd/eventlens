services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.47.5
    environment:
      CLICKHOUSE_DB: eventlens
      CLICKHOUSE_USER: eventlens
      CLICKHOUSE_PASSWORD: eventlens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "eventlens", "--password", "eventlens", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:13.2.7
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shop.json
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.5
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - clickhouse

  eventlens:
    image: eventlens:local
    build: .
    profiles: ["app"]
    environment:
      EVENTLENS_CLICKHOUSE_ADDR: clickhouse:9000
      EVENTLENS_WRITE_KEY: dev-write-key
    ports:
      - "8080:8080"
    depends_on:
      clickhouse:
        condition: service_healthy

  loadgen:
    image: eventlens:local
    build: .
    profiles: ["load"]
    entrypoint: ["/loadgen", "-url", "http://eventlens:8080", "-key", "dev-write-key"]
    command: ["-rate", "3000"]

  postgres:
    image: postgres:18.7
    profiles: ["bench"]
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "work_mem=64MB", "-c", "max_parallel_workers_per_gather=4"]
    shm_size: 1g
    environment:
      POSTGRES_DB: eventlens
      POSTGRES_USER: eventlens
      POSTGRES_PASSWORD: eventlens
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlens -d eventlens"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
  postgres-data:

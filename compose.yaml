services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.47.5
    environment:
      CLICKHOUSE_DB: eventlens
      CLICKHOUSE_USER: eventlens
      CLICKHOUSE_PASSWORD: eventlens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "eventlens", "--password", "eventlens", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
